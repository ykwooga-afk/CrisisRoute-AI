<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrisisRoute AI - Standalone Demo</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwZjc2NmUiLz4KICA8cGF0aCBkPSJNMTYgNDJjOC0xNiAyMC0yMiAzNC0yMC02IDQtOCA5LTcgMTYtOC01LTE3LTQtMjcgNFoiIGZpbGw9IiNmYWNjMTUiLz4KICA8Y2lyY2xlIGN4PSIyNCIgY3k9IjIzIiByPSI3IiBmaWxsPSIjZmZmZmZmIi8+CiAgPHBhdGggZD0iTTIzIDIwaDEwdjZIMjN6IiBmaWxsPSIjMjU2M2ViIi8+Cjwvc3ZnPgo=" type="image/svg+xml" />
    <style>
:root {
  color-scheme: light;
  --green-950: #123f31;
  --green-900: #174c3a;
  --green-800: #1c6048;
  --green-500: #22945f;
  --mint: #9be7bd;
  --mint-soft: #d6f5e3;
  --jade-muted: #76c99b;
  --ivory: #f8f6ef;
  --ivory-2: #f3f0e7;
  --ink: #202534;
  --muted: #87909f;
  --faint: #aeb6c2;
  --line: #ded9cc;
  --line-strong: #cfc8ba;
  --red: #c91f24;
  --orange: #de7d00;
  --blue: #2868e8;
  --violet: #7c3aed;
  --radius: 6px;
  --display: Georgia, "Times New Roman", serif;
  --sans: Inter, "Segoe UI", Calibri, Arial, sans-serif;
  font-family: var(--sans);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--ivory);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--ivory);
}

button,
textarea,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

h1,
h2,
h3,
p,
blockquote {
  margin-top: 0;
}

.app-shell {
  min-height: 100vh;
  background: var(--ivory);
}

.top-nav {
  color: #f6fbf8;
  background: var(--green-900);
}

.nav-upper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 70px;
  padding: 0 58px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.brand-area,
.mode-area,
.view-nav,
.mode-switch,
.status-line,
.workflow-rail,
.metadata-line,
.case-meta-line,
.verify-actions,
.decision-stack,
.locked-actions,
.language-tabs {
  display: flex;
  align-items: center;
}

.brand-area {
  min-width: 0;
  gap: 12px;
}

.brand-logo {
  display: block;
  flex: 0 0 auto;
  width: auto;
  height: 34px;
  object-fit: contain;
  filter: drop-shadow(0 1px 1px rgba(5, 22, 16, 0.24));
}

.brand-area strong {
  font-family: var(--display);
  font-size: 19px;
  font-style: italic;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.mode-area {
  gap: 10px;
  justify-content: flex-end;
}

.mode-switch {
  min-height: 32px;
  gap: 2px;
  padding: 2px;
  border: 1px solid rgba(214, 245, 227, 0.12);
  border-radius: 5px;
  background: rgba(18, 63, 49, 0.28);
}

.mode-switch button {
  min-height: 28px;
  border: 0;
  border-radius: 4px;
  padding: 0 11px;
  color: rgba(246, 251, 248, 0.62);
  background: transparent;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
}

.mode-switch button.active {
  color: #fff8da;
  background: rgba(203, 132, 18, 0.30);
}

.mode-pill,
.gonka-pill {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  border-radius: 5px;
  padding: 0 12px;
  font-family: "Consolas", "SFMono-Regular", monospace;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.055em;
  line-height: 1;
  white-space: nowrap;
}

.mode-pill {
  color: #f7d36b;
  background: rgba(159, 111, 24, 0.55);
}

.gonka-pill {
  color: #b4dcc8;
  background: rgba(255, 255, 255, 0.08);
}

.gonka-pill.connected {
  color: #d5ffe6;
  background: rgba(34, 148, 95, 0.35);
}

.gonka-pill.unavailable {
  color: #ffd0c9;
  background: rgba(201, 31, 36, 0.22);
}

.avatar {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  margin-left: 4px;
  border-left: 1px solid rgba(155, 231, 189, 0.18);
  border-radius: 50%;
  color: #d5ffe6;
  background: #118957;
  font-size: 12px;
  font-weight: 900;
}

.view-nav {
  min-height: 44px;
  padding: 0 58px;
  gap: 12px;
}

.view-nav button {
  position: relative;
  min-height: 44px;
  border: 0;
  padding: 0 18px;
  color: rgba(155, 231, 189, 0.64);
  background: transparent;
  font-weight: 820;
}

.view-nav button.active {
  color: #ffffff;
}

.view-nav button.active::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 2px;
  background: rgba(246, 251, 248, 0.86);
}

.page-canvas {
  width: min(100%, 1760px);
  margin: 0 auto;
  padding: 36px 58px 54px;
}

.system-alert {
  margin: 24px auto 0;
  width: min(1640px, calc(100vw - 80px));
  border-left: 3px solid var(--orange);
  padding: 12px 14px;
  color: #8a5a10;
  background: #fff6e2;
  font-weight: 750;
}

.section-kicker {
  margin-bottom: 18px;
  color: var(--faint);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.section-kicker.red {
  color: var(--red);
}

.status-line {
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 34px;
  color: var(--muted);
  font-size: 15px;
}

.status-line strong {
  color: #303645;
}

.divider {
  width: 1px;
  height: 18px;
  background: var(--line-strong);
}

.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 8px;
  border-radius: 50%;
  background: #b9c0c9;
}

.dot.violet {
  background: var(--violet);
}

.dot.amber {
  background: var(--orange);
}

.dot.green {
  background: #179055;
}

.workflow-rail {
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 40px;
  color: #aab1bc;
  font-size: 13px;
  font-weight: 750;
}

.workflow-rail span {
  display: inline-flex;
  align-items: center;
}

.workflow-rail b {
  color: #c0c4cb;
  font-weight: 500;
}

.workflow-rail .active {
  border: 1px solid #ffd59d;
  border-radius: 4px;
  padding: 6px 11px;
  color: var(--orange);
  background: #fff6e6;
}

.command-grid {
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr) 430px;
  gap: 30px;
  align-items: start;
}

.incident-queue {
  padding-top: 4px;
}

.queue-item {
  position: relative;
  min-height: 112px;
  border-bottom: 1px solid var(--line);
  padding: 17px 0 16px;
  transition: background 140ms ease, box-shadow 140ms ease;
}

.queue-item.active {
  margin-left: -16px;
  border-left: 4px solid var(--green-800);
  padding-left: 16px;
  background: rgba(244, 240, 231, 0.72);
}

.queue-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}

.queue-meta span,
.queue-item small {
  color: var(--faint);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.queue-meta b,
.operational-state b {
  border-radius: 4px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0;
  text-transform: uppercase;
}

.queue-item h3 {
  margin: 0 0 5px;
  font-size: 16px;
  line-height: 1.25;
}

.queue-item p {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 14px;
}

.queue-item small {
  display: block;
  color: var(--green-500);
}

.state-green {
  color: #159052;
  background: #e9f7ed;
}

.state-amber {
  color: var(--orange);
  background: #fff2da;
}

.state-violet {
  color: var(--violet);
  background: #f3edff;
}

.state-blue {
  color: var(--blue);
  background: #eef4ff;
}

.state-muted {
  color: #757d88;
  background: #eeece5;
}

.selected-case-summary h1,
.case-intel-header h1,
.screen-heading h1,
.safety-header h1,
.action-brief-main h1,
.action-locked-state h1 {
  margin-bottom: 12px;
  font-family: var(--display);
  font-size: 42px;
  font-weight: 500;
  line-height: 1.08;
}

.case-meta-line,
.metadata-line {
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 650;
}

.aqi {
  border-radius: 3px;
  padding: 3px 7px;
  color: var(--orange);
  background: #fff0d6;
  font-family: "Consolas", "SFMono-Regular", monospace;
  font-weight: 900;
}

.source-line {
  color: #9aa2af;
  font-size: 14px;
  font-weight: 650;
}

blockquote {
  max-width: 850px;
  margin: 26px 0;
  border-left: 2px solid #f1af55;
  padding-left: 24px;
  color: #404756;
  font-size: 18px;
  font-style: italic;
  line-height: 1.6;
}

.knowledge-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 52px;
  max-width: 900px;
  margin: 28px 0 52px;
}

.knowledge-grid h2 {
  margin-bottom: 12px;
  color: var(--green-500);
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.knowledge-grid h2.red-title {
  color: var(--red);
}

.known-list,
.unknown-list,
.missing-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.known-list li,
.unknown-list li,
.missing-list li {
  position: relative;
  margin-bottom: 10px;
  padding-left: 22px;
  color: #353a47;
  font-size: 16px;
}

.known-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: #179055;
}

.unknown-list li::before,
.missing-list li::before {
  content: "×";
  position: absolute;
  left: 0;
  color: var(--red);
}

.three-axis {
  display: grid;
  gap: 58px;
  margin-bottom: 70px;
}

.three-axis.command {
  max-width: 960px;
}

.score-axis {
  color: #9da5b2;
}

.score-row {
  display: grid;
  grid-template-columns: minmax(150px, 190px) minmax(0, 1fr);
  align-items: baseline;
  gap: 18px;
}

.score-row span {
  color: #a6aeb9;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.score-row strong {
  justify-self: end;
  color: var(--orange);
  font-family: var(--display);
  font-size: 31px;
  font-weight: 500;
  line-height: 0.9;
}

.score-axis.urgency .score-row strong {
  color: var(--red);
  font-size: 67px;
}

.score-axis.actionability .score-row strong {
  color: var(--red);
}

.score-track {
  height: 6px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: #dedbd1;
}

.score-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--orange);
}

.score-axis.urgency .score-track {
  height: 12px;
}

.score-axis.urgency .score-track i,
.score-axis.actionability .score-track i {
  background: var(--red);
}

.score-axis p {
  margin: 8px 0 0;
  color: var(--faint);
  font-size: 14px;
}

.score-axis.urgency p,
.score-axis.actionability p {
  color: #d85255;
}

.key-insight {
  margin-top: 16px;
}

.key-insight h2,
.urgent-not-dispatchable h2,
.footer-principle h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
}

.key-insight strong,
.urgent-not-dispatchable strong {
  display: block;
  color: var(--red);
  font-size: 54px;
  font-weight: 400;
  line-height: 0.95;
}

.key-insight p {
  max-width: 460px;
  color: var(--muted);
  line-height: 1.5;
}

.operational-state {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 44px;
}

.operational-state span {
  color: var(--faint);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.safety-assessment {
  padding-top: 5px;
}

.assessment-list {
  margin-top: 28px;
  border-top: 1px solid var(--line);
}

.assessment-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 54px;
  border-bottom: 1px solid var(--line);
  color: #343945;
  font-size: 16px;
}

.gate-status {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.04em;
}

.gate-status.triggered {
  color: var(--orange);
}

.gate-status.blocked,
.gate-status.locked {
  color: #d64545;
}

.gate-status.passed {
  color: #1d9257;
}

.recommendation {
  margin: 26px 0 24px;
  border-left: 2px solid #f1af55;
  padding-left: 16px;
  color: var(--muted);
  line-height: 1.55;
}

.decision-stack {
  flex-direction: column;
  gap: 10px;
}

.primary-action,
.secondary-action,
.text-action {
  min-height: 48px;
  border-radius: 5px;
  padding: 0 24px;
  font-weight: 820;
  transition: border-color 140ms ease, background 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}

.primary-action {
  border: 1px solid var(--green-900);
  color: #ffffff;
  background: var(--green-900);
  box-shadow: 0 1px 0 rgba(18, 63, 49, 0.18);
}

.secondary-action {
  border: 1px solid var(--line-strong);
  color: #353a47;
  background: rgba(255, 255, 255, 0.26);
}

.primary-action:hover:not(:disabled) {
  background: var(--green-950);
  border-color: var(--green-950);
}

.secondary-action:hover:not(:disabled) {
  border-color: #bdb4a4;
  background: rgba(255, 255, 255, 0.48);
}

.secondary-action:disabled {
  color: #aeb6c2;
  border-color: #ece6da;
  background: #efebe2;
  box-shadow: none;
  opacity: 1;
}

.text-action {
  border: 0;
  color: var(--muted);
  background: transparent;
}

.text-action:hover:not(:disabled) {
  color: var(--green-900);
}

.decision-stack button {
  width: 100%;
}

.case-link-summary {
  margin-top: 28px;
  color: var(--faint);
  font-size: 13px;
}

.case-link-summary button {
  display: block;
  margin-top: 10px;
  border: 0;
  padding: 0;
  color: var(--green-900);
  background: transparent;
  font-weight: 850;
}

.verify-panel {
  margin-top: 72px;
  border-top: 1px solid var(--line);
  padding-top: 30px;
}

.verify-panel p {
  margin-top: -8px;
  color: var(--muted);
}

.verify-panel textarea {
  width: 100%;
  min-height: 118px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 18px 22px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.34);
  font-size: 16px;
  line-height: 1.5;
}

.verify-panel textarea:focus {
  outline: 3px solid rgba(23, 76, 58, 0.14);
  border-color: var(--green-800);
}

.verify-actions {
  gap: 12px;
  margin-top: 22px;
}

.verify-panel small {
  display: block;
  margin-top: 12px;
  color: #abb2be;
}

.intelligence-page,
.evidence-page,
.safety-page,
.action-page {
  max-width: 1560px;
}

.case-intel-header {
  max-width: 1280px;
  margin: 16px auto 74px;
}

.intelligence-page .three-axis {
  max-width: 780px;
  margin: 0 auto 52px;
}

.intelligence-page .score-row {
  grid-template-columns: 150px minmax(0, 1fr);
}

.intelligence-page .score-row strong {
  justify-self: start;
}

.intelligence-page .score-axis.urgency {
  position: relative;
  margin-left: -24px;
  border-left: 5px solid var(--red);
  padding: 34px 0 24px 28px;
}

.editorial-quote {
  max-width: 780px;
  margin: 0 auto 56px;
  color: #858c99;
  font-family: var(--display);
  font-size: 20px;
  font-style: italic;
  line-height: 1.45;
}

.text-section,
.claims-section,
.intel-bottom-grid {
  max-width: 1380px;
  margin: 0 auto 42px;
  border-top: 1px solid var(--line);
  padding-top: 26px;
}

.text-section p {
  max-width: 820px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.62;
}

.claims-table {
  border-top: 1px solid var(--line);
}

.claim-row {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr) 240px;
  gap: 20px;
  align-items: center;
  min-height: 56px;
  border-bottom: 1px solid var(--line);
}

.claim-row span {
  color: var(--faint);
  font-size: 12px;
  font-weight: 900;
}

.claim-row p {
  margin: 0;
  font-size: 16px;
}

.claim-row b {
  justify-self: end;
  font-size: 12px;
  letter-spacing: 0.03em;
}

.claim-status.supported {
  color: #1d9257;
}

.claim-status.reported {
  color: var(--red);
}

.claim-status.partial {
  color: var(--orange);
}

.claim-status.contradiction {
  color: var(--red);
}

.intel-bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
}

.risk-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.risk-tags span {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.28);
}

.wide-cta {
  display: block;
  width: fit-content;
  margin: 24px auto 0;
}

.screen-heading {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 38px;
}

.screen-heading h1 {
  margin-bottom: 6px;
}

.screen-heading p {
  color: var(--faint);
  font-size: 15px;
}

.evidence-layout {
  display: grid;
  grid-template-columns: 260px minmax(560px, 1fr) 360px;
  gap: 28px;
  align-items: start;
}

.claims-sidebar {
  padding-top: 4px;
}

.evidence-claim-item {
  margin-bottom: 8px;
  border-left: 4px solid #aab1bc;
  padding: 18px 0 18px 18px;
}

.evidence-claim-item.supported {
  border-left-color: #1d9257;
}

.evidence-claim-item.reported,
.evidence-claim-item.contradiction {
  border-left-color: var(--red);
}

.evidence-claim-item.partial {
  border-left-color: var(--orange);
}

.evidence-claim-item span {
  display: block;
  margin-bottom: 8px;
  color: var(--faint);
  font-size: 12px;
  font-weight: 900;
}

.evidence-claim-item strong {
  display: block;
  margin-bottom: 10px;
  font-size: 14px;
  line-height: 1.45;
}

.evidence-claim-item b {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.evidence-network-panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 26px;
  background: rgba(255, 255, 255, 0.22);
}

.evidence-network {
  display: block;
  width: 100%;
  min-height: 500px;
}

.connection {
  fill: none;
  stroke-width: 2;
  opacity: 0.35;
}

.connection.active {
  opacity: 1;
}

.connection.quiet {
  opacity: 0.28;
}

.connection.supports {
  stroke: #1e9b59;
}

.connection.partial {
  stroke: var(--orange);
  stroke-dasharray: 7 6;
}

.connection.contradiction {

const DATA_MODES = {
  mock: "mock",
  live: "live",
  replay: "replay"
};

async function loadHazeScenario(mode = DATA_MODES.mock) {
  await wait(320);

  if (mode === DATA_MODES.replay) {
    return getReplayScenario();
  }

  if (mode === DATA_MODES.live) {
    const response = await fetch("/api/incidents/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        scenario: "malaysia_haze_fire_smoke",
        messages: rawReports
      })
    });

    if (!response.ok) {
      const error = await safeJson(response);
      throw new Error(error?.message || "Live Gonka backend is not ready yet.");
    }

    return response.json();
  }

  return cloneScenario();
}

async function analyzeIncidents(messages, mode = DATA_MODES.mock) {
  if (mode === DATA_MODES.live) {
    const response = await fetch("/api/incidents/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    if (!response.ok) {
      const error = await safeJson(response);
      throw new Error(error?.message || "Live Gonka analysis failed.");
    }

    return response.json();
  }

  const scenario = mode === DATA_MODES.replay ? getReplayScenario() : cloneScenario();
  return {
    ...scenario,
    incidents: messages.length
      ? messages.map((message, index) => makeDraftIncident(message, index, mode))
      : scenario.incidents
  };
}

async function submitHumanDecision(incident, decision, mode = DATA_MODES.mock) {
  const decidedAt = new Date().toISOString();

  if (mode === DATA_MODES.live) {
    const response = await fetch(`/api/incidents/${incident.caseId}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, decidedAt })
    });

    if (!response.ok) {
      const error = await safeJson(response);
      throw new Error(error?.message || "Decision API failed.");
    }

    return response.json();
  }

  const receiptPayload = {
    caseId: incident.caseId,
    evidenceHashes: incident.evidence.map(item => `sha256:${simpleHash(item.id + item.summary)}`),
    gonkaResponseIds: [incident.gonka.analyst.responseId, incident.gonka.reviewer.responseId],
    promptVersions: [incident.gonka.analyst.promptVersion, incident.gonka.reviewer.promptVersion],
    decision,
    approvedByRole: "Coordinator Aisha Rahman",
    timestamp: decidedAt
  };

  return {
    ...incident,
    humanDecision: {
      decision,
      decidedAt,
      decidedBy: "Coordinator Aisha Rahman"
    },
    proofCapsule: {
      ...receiptPayload,
      receiptHash: `sha256:${simpleHash(JSON.stringify(receiptPayload))}`
    }
  };
}

async function generateActionBrief(incident, mode = DATA_MODES.mock) {
  if (mode === DATA_MODES.live) {
    const response = await fetch(`/api/incidents/${incident.caseId}/brief`, { method: "POST" });
    if (!response.ok) {
      const error = await safeJson(response);
      throw new Error(error?.message || "Brief generation failed.");
    }

  }

  return incident.actionBrief || incident.actionPlan?.languages || {

    ms: "Sila lengkapkan maklumat yang hilang sebelum tindakan sukarelawan."
  };
}

async function getGonkaHealth() {
  if (window.location.protocol === "file:") {
    return { ok: false, message: "Standalone demo file. Start the local server for live backend health checks." };
  }

  try {
    const response = await fetch("/api/health/gonka");
    return await response.json();
  } catch {
    return { ok: false, message: "Local health route unavailable." };
  }
}

function makeDraftIncident(message, index, mode) {
  const id = `draft_${index + 1}`;
  const tracePrefix = mode === DATA_MODES.replay ? "recorded" : "demo";
  const lower = message.toLowerCase();
  const hasBreathingRisk = /asthma|breath|cough|smoke|respir/i.test(message);
  const hasLocation = /block|hostel|shah alam|campus|room|hall/i.test(message);
  const urgency = hasBreathingRisk ? 86 : 58;
  const actionability = hasLocation ? 64 : 28;
  const verification = message.length > 80 ? 62 : 48;

  return {
    caseId: id,
    label: String.fromCharCode(65 + index),
    title: `Custom report ${index + 1}`,
    rawMessage: message,
    source: "Manual intake",
    receivedAt: new Date().toISOString(),
    location: hasLocation ? extractLocationHint(message) : "Unknown location",
    peopleCount: lower.match(/\b\d+\b/) ? Number(lower.match(/\b\d+\b/)[0]) : null,
    needs: inferNeeds(message),
    riskFlags: hasBreathingRisk ? ["possible respiratory risk"] : ["needs classification"],
    claims: [
      {
        id: `${id}_claim_1`,
        text: message,
        status: "unverified",
        evidenceIds: [`${id}_E1`]
      }
    ],
    evidence: [
      {
        id: `${id}_E1`,
        type: "manual_input",
        summary: "Raw text provided by coordinator for analysis.",
        retrievedAt: new Date().toISOString()
      }
    ],
    scores: { verification, urgency, actionability },
    operationalState: actionability < 40 ? "URGENT_VERIFICATION" : urgency > 80 ? "NEEDS_HUMAN_REVIEW" : "QUEUED_ACTION",
    missingFields: actionability < 40 ? ["exact location", "callback contact"] : ["independent evidence"],
    modelDebate: {
      agreement: ["Manual input needs structured verification"],
      disagreement: ["Mock mode cannot prove independent corroboration"],
      counterEvidence: ["No live Gonka backend connected yet"],
      consensus: mode === DATA_MODES.replay ? "Replay response should be replaced by live Gonka before final pitch." : "Mock draft generated for UI testing."
    },
    safetyGates: [
      {
        id: "G_LOCATION",
        label: "Exact location present",
        passed: hasLocation,
        detail: hasLocation ? "Location hint found." : "Location missing; dispatch blocked."
      },
      {
        id: "G_CONTACT",
        label: "Contact path available",
        passed: false,
        detail: "Manual input does not include verified callback contact."
      }
    ],
    recommendedAction: hasBreathingRisk
      ? "Confirm location/contact immediately and prepare respiratory support resources."
      : "Ask for missing details and queue for coordinator review.",
    actionBrief: null,
    proofCapsule: null,
    gonka: {
      mode,
      analyst: {
        model: `${tracePrefix}-analyst-model`,
        responseId: `${tracePrefix}-response-${id}-analyst`,
        promptVersion: "analyst-v1",
        latencyMs: 0
      },
      reviewer: {
        model: `${tracePrefix}-reviewer-model`,
        responseId: `${tracePrefix}-response-${id}-reviewer`,
        promptVersion: "reviewer-v1",
        latencyMs: 0
      }
    },
    humanDecision: null
  };
}

function inferNeeds(message) {
  const needs = [];
  if (/mask|n95/i.test(message)) needs.push("N95 masks");
  if (/water/i.test(message)) needs.push("water");
  if (/clinic|transport|hospital/i.test(message)) needs.push("clinic transport");
  if (/room|shelter|indoor/i.test(message)) needs.push("indoor safe room");
  return needs.length ? needs : ["verification call"];
}

function extractLocationHint(message) {
  const match = message.match(/(Block\s+[A-Z]|Hostel\s+[A-Z]|Shah Alam|campus field|room\s+\w+)/i);
  return match ? match[0] : "Location mentioned, needs cleanup";
}

async function safeJson(response) {
  try {
    return await response.json();
  } catch {
    return null;
  }
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function simpleHash(input) {
  let hash = 0x811c9dc5;
  for (let i = 0; i < input.length; i += 1) {
    hash ^= input.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  return (hash >>> 0).toString(16).padStart(8, "0");
}

async function init() {

    "Family near Shah Alam says an elderly parent has breathing difficulty due to haze. Exact location and callback number are unclear.",
    "Block C hostel: six students are coughing badly, one has asthma. Need N95 masks and clinic transport."
  ].join("\n");
  await withLoading(() => loadDemoScenario());
  await refreshHealth();
  bindEvents();
}

function bindEvents() {
  app.addEventListener("click", async event => {
    const button = event.target.closest("[data-action]");
    const caseTarget = event.target.closest("[data-case-id]");
    const evidenceTarget = event.target.closest("[data-evidence-id]");

    if (caseTarget && !button) {
      selectIncident(caseTarget.dataset.caseId);
      render();
      return;
    }

    if (evidenceTarget && !button) {
      state.selectedEvidenceId = evidenceTarget.dataset.evidenceId;
      render();
      return;
    }

    if (!button) return;

    const action = button.dataset.action;

    if (action === "view") {
      state.currentView = button.dataset.view;
      ensureEvidenceSelection();
      render();
      return;
    }

    if (action === "load-demo") {
      state.mode = DATA_MODES.mock;
      await withLoading(() => loadDemoScenario());
      return;
    }

    if (action === "verify-input") {
      await handleVerifyInput();
      return;
    }

    if (action === "mode") {
      state.mode = button.dataset.mode;
      await withLoading(() => loadModeScenario(state.mode));
      return;
    }

    if (action === "select-evidence") {
      state.selectedEvidenceId = button.dataset.evidenceId;
      render();
      return;
    }

    if (action === "language") {
      state.selectedLanguage = button.dataset.lang;
      render();
      return;
    }

    if (action === "decision") {
      await handleDecision(button.dataset.decision);
    }
  });

  app.addEventListener("input", event => {
    if (event.target.matches("#verify-input")) {
      state.intakeValue = event.target.value;
    }
  });
}

async function loadDemoScenario() {
  state.error = null;
  const result = await loadHazeScenario(DATA_MODES.mock);
  state.incidents = result.incidents || [];
  state.resources = result.resources || [];
  selectIncident(findCaseByLabel("03")?.caseId || state.incidents[0]?.caseId || null);
  state.currentView = VIEWS.command;
  showToast("Malaysia haze demo loaded. CASE 03 selected.");
}

async function loadModeScenario(mode) {
  state.error = null;
  try {
    if (mode === DATA_MODES.live) {
      await refreshHealth();
      if (!isLiveConnected()) {
        state.error = "Live backend unavailable: Gonka backend routes are not connected yet.";
        showToast("Live backend unavailable. No fake Gonka result was created.");
        return;
      }
    }

    const result = await loadHazeScenario(mode);
    state.incidents = result.incidents || [];
    state.resources = result.resources || state.resources;
    selectIncident(findCaseByLabel("03")?.caseId || state.incidents[0]?.caseId || null);
    showToast(mode === DATA_MODES.replay ? "Recorded replay loaded." : "Live scenario loaded.");
  } catch (error) {
    state.error = `Live backend unavailable: ${error.message}`;
    showToast("Live backend unavailable. Demo data was not converted into live data.");
  }
  await refreshHealth();
}

async function handleVerifyInput() {
  const messages = state.intakeValue
    .split("\n")
    .map(line => line.trim())
    .filter(Boolean);

  if (!messages.length) {
    showToast("Paste a crisis report or source URL first.");
    return;
  }

  state.error = null;
  await withLoading(async () => {
    try {
      if (state.mode === DATA_MODES.live) {
        await refreshHealth();
        if (!isLiveConnected()) {
          throw new Error("Gonka backend routes are not connected yet.");
        }
      }

      const result = await analyzeIncidents(messages, state.mode);
      state.incidents = result.incidents || [];
      state.resources = result.resources || state.resources;
      selectIncident(state.incidents[0]?.caseId || null);
      state.currentView = VIEWS.intelligence;
      showToast(state.mode === DATA_MODES.live ? "Live analysis returned." : "Demo analysis generated by local adapter.");
    } catch (error) {
      state.error = `Verification unavailable: ${error.message}`;
      showToast("Live verification unavailable. No fake Gonka result was created.");
    }
  });
}

async function handleDecision(decision) {
  const incident = getSelectedIncident();
  if (!incident) return;

  if (decision === "APPROVED" && isDispatchBlocked(incident)) {
    showToast("Approve Dispatch is locked until required Safety Gates pass.");
    return;
  }

  await withLoading(async () => {
    const actionBrief = decision === "APPROVED" ? await generateActionBrief(incident, state.mode) : incident.actionBrief;
    const updated = await submitHumanDecision({ ...incident, actionBrief }, decision, state.mode);
    state.incidents = state.incidents.map(item => (item.caseId === incident.caseId ? updated : item));
    selectIncident(updated.caseId);

    if (decision === "APPROVED") {
      state.currentView = VIEWS.action;
      showToast("Human approval saved. Action Brief unlocked.");
    } else {
      showToast(`Human decision saved: ${decision.replaceAll("_", " ")}`);
    }
  });
}

async function refreshHealth() {
  state.health = await getGonkaHealth();
  render();
}

async function withLoading(fn) {
  state.loading = true;
  render();
  try {
    await fn();
  } finally {
    state.loading = false;
    render();
  }
}

function renderCurrentView(incident) {
  if (!incident) {
    return `
      <main class="page-canvas">
        <section class="empty-page">
          <h1>CrisisRoute AI</h1>
          <p>No incident loaded yet.</p>
          <button class="primary-action" data-action="load-demo">Load Malaysia Haze Demo</button>
        </section>
      </main>
    `;
  }

  if (state.currentView === VIEWS.intelligence) return renderCaseIntelligence(incident);
  if (state.currentView === VIEWS.evidence) return renderEvidenceView(incident);
  if (state.currentView === VIEWS.safety) return renderSafetyView(incident);
  if (state.currentView === VIEWS.action) return renderActionBriefView(incident);
  return renderCommandCenter(incident);
}

function renderCommandCenter(incident) {
  return `
    <main class="page-canvas command-center">
      ${renderStatusLine()}
      ${renderWorkflowRail("Safety Gate")}
      <section class="command-grid">
        <aside class="incident-queue" aria-label="Incident Queue">
          <h2 class="section-kicker">Incident Queue</h2>
          ${state.incidents.map(renderQueueItem).join("")}
        </aside>
        <section class="command-main-panel">
          ${renderSelectedCaseSummary(incident)}
          ${renderThreeAxisScores(incident, "command")}
          ${renderKeyInsight(incident)}
        </section>
        <aside class="safety-assessment">
          ${renderSafetyAssessment(incident)}
        </aside>
      </section>
      ${renderVerifyInput()}
    </main>
  `;
}

function renderStatusLine() {
  const reviewCount = countByState("NEEDS_HUMAN_REVIEW");
  const urgentCount = countByState("URGENT_VERIFICATION");
  const dispatchCount = countByState("DISPATCH_CANDIDATE");
  const masks = state.resources.find(resource => resource.id === "res_masks")?.available || 0;

  return `
    <section class="status-line" aria-label="Incident summary">
      <strong>${state.incidents.length} Active Incidents</strong>
      <span class="divider"></span>
      <span><i class="dot violet"></i>${reviewCount} Needs Human Review</span>
      <span class="divider"></span>
      <span><i class="dot amber"></i>${urgentCount} Urgent Verification</span>
      <span class="divider"></span>
      <span><i class="dot green"></i>${dispatchCount} Dispatch Candidate</span>
      <span class="divider"></span>
      <span>${masks} N95 Masks Available</span>
    </section>
  `;
}

function renderWorkflowRail(activeLabel) {
  const items = ["Incoming", "Evidence", "Blind AI Review", "Safety Gate", "Human Decision", "Action Brief"];
  return `
    <section class="workflow-rail" aria-label="Workflow">
      ${items
        .map(
          (item, index) => `
            <span class="${item === activeLabel ? "active" : ""}">

function renderEvidenceNetwork(incident) {
  const selectedId = getSelectedEvidence(incident)?.id;
  const claims = incident.claims;
  const evidence = incident.evidence;
  const claimY = index => 88 + index * 88;
  const evidenceY = index => 88 + index * 88;
  const width = 880;
  const height = Math.max(430, Math.max(claims.length, evidence.length) * 90 + 100);
  const evidenceIndex = new Map(evidence.map((item, index) => [item.id, index]));

  const paths = claims
    .flatMap((claim, claimIndex) =>
      claim.evidenceIds.map(evidenceId => {
        const targetIndex = evidenceIndex.get(evidenceId);
        if (targetIndex === undefined) return "";
        const active = evidenceId === selectedId;
        const kind = connectionKind(claim, evidence[targetIndex]);
        const y1 = claimY(claimIndex);
        const y2 = evidenceY(targetIndex);
        return `<path class="connection ${kind} ${active ? "active" : "quiet"}" d="M190 ${y1} C360 ${y1}, 520 ${y2}, 690 ${y2}" />`;
      })
    )
    .join("");

  return `
    <svg class="evidence-network" viewBox="0 0 ${width} ${height}" role="img" aria-label="Claim to evidence network">
      ${paths}
      ${claims
        .map((claim, index) => {
          const y = claimY(index);
          return `
            <g class="network-claim ${claimStatusClass(claim.status)}" transform="translate(70 ${y})">
              <circle r="8"></circle>
              <text x="22" y="5">${escapeSvg(claim.id)}</text>
            </g>
          `;
        })
        .join("")}
      ${evidence
        .map((item, index) => {
          const y = evidenceY(index);
          const active = item.id === selectedId ? "active" : "";
          return `
            <g class="network-evidence ${active}" data-evidence-id="${escapeSvg(item.id)}" transform="translate(690 ${y})">
              <rect x="-8" y="-8" width="16" height="16"></rect>
              <text x="24" y="5">${escapeSvg(item.id)} ${escapeSvg(item.type)}</text>
            </g>
          `;
        })
        .join("")}
      <g class="network-legend" transform="translate(70 ${height - 46})">
        <line class="connection supports active" x1="0" x2="34" y1="0" y2="0"></line>
        <text x="48" y="5">Supports</text>
        <line class="connection partial active" x1="160" x2="194" y1="0" y2="0"></line>
        <text x="208" y="5">Partial</text>
        <line class="connection contradiction active" x1="310" x2="344" y1="0" y2="0"></line>
        <text x="358" y="5">Contradiction</text>
        <line class="connection none active" x1="510" x2="544" y1="0" y2="0"></line>
        <text x="558" y="5">No independent source</text>
      </g>
    </svg>
  `;
}

        <span class="section-kicker">Action Brief</span>
        <h1>${escapeHtml(incident.title)}</h1>
        <p>${escapeHtml(
          blocked
            ? "This incident cannot produce an approved volunteer dispatch brief because Safety Gates are still blocked."
            : "This incident is ready for human review. Approve Dispatch to unlock the Action Brief."
        )}</p>
        <div class="locked-actions">
          <button class="primary-action" data-action="view" data-view="safety">Open Safety Decision</button>
          <button class="secondary-action" data-action="decision" data-decision="APPROVED" ${blocked ? "disabled" : ""}>Approve Dispatch</button>
        </div>
      </section>
    </main>
  `;
}

function briefMeta(label, value, tone = "") {
  return `
    <div>
      <span>${escapeHtml(label)}</span>
      <strong class="${tone}">${escapeHtml(value || "Not available")}</strong>
    </div>
  `;
}

function languageButton(lang, label) {
  return `
    <button class="${state.selectedLanguage === lang ? "active" : ""}" data-action="language" data-lang="${lang}">
      ${escapeHtml(label)}${state.selectedLanguage === lang ? " / active" : ""}
    </button>
  `;
}

function briefGate(label, passed) {
  return `<span class="${passed ? "passed" : "blocked"}">${passed ? "PASSED" : "BLOCKED"} · ${escapeHtml(label)}</span>`;
}

function renderProofReceipt(incident, proof) {
  const evidenceHashes = proof?.evidenceHashes || incident.evidence.map(item => `sha256:${simpleHash(item.id + item.summary)}`);
  const receiptHash = proof?.receiptHash || "pending-human-approval";
  const human = incident.humanDecision || {};

  return `
    <article class="proof-receipt">
      <h3>Decision Record</h3>
      ${receiptRow("Case ID", incident.caseId)}
      ${receiptRow("Incident", incident.title)}
      ${receiptRow("Human Decision", human.decision || "PENDING")}
      <h3>Evidence Chain</h3>
      ${receiptRow("Evidence hashes", evidenceHashes.map(shortHash).join("   "))}
      <h3>AI Verification</h3>
      ${receiptRow("Analyst", incident.gonka.analyst.model)}
      ${receiptRow("Analyst resp.", incident.gonka.analyst.responseId)}
      ${receiptRow("Reviewer", incident.gonka.reviewer.model)}
      ${receiptRow("Reviewer resp.", incident.gonka.reviewer.responseId)}
      ${receiptRow("Prompt version", incident.gonka.analyst.promptVersion)}
      ${receiptRow("Consensus", scoreText(incident))}
      <h3>Human Decision</h3>
      ${receiptRow("Approved by", human.decidedBy || "Not approved")}
      ${receiptRow("Timestamp", human.decidedAt || "Pending")}
      <h3>Receipt</h3>
      ${receiptRow("Receipt hash", shortHash(receiptHash))}
      <p class="receipt-footnote">This receipt records the decision chain. It is not a blockchain claim.</p>
    </article>
  `;
}

function receiptRow(label, value) {
  return `
    <div class="receipt-row">
      <span>${escapeHtml(label)}</span>
      <b>${escapeHtml(value)}</b>
    </div>
  `;
}

function renderAuditTimeline(incident) {
  const events = auditEvents(incident);
  return `
    <section class="audit-timeline">
      <h2 class="section-kicker">Audit Timeline</h2>
      <div class="timeline-line">
        ${events
          .map(
            event => `
              <article>
                <time>${escapeHtml(formatTime(event.time))}</time>
                <span></span>
                <strong>${escapeHtml(event.label)}</strong>
                <p>${escapeHtml(event.detail)}</p>
              </article>
            `
          )
          .join("")}
      </div>
    </section>
  `;
}

function auditEvents(incident) {
  const reportTime = incident.receivedAt;
  const evidenceTime = incident.evidence[0]?.retrievedAt || addMinutes(reportTime, 1);
  const analystTime = addMinutes(reportTime, 3);
  const reviewerTime = addMinutes(reportTime, 4);
  const consensusTime = addMinutes(reportTime, 5);
  const safetyTime = addMinutes(reportTime, 6);
  const humanTime = incident.humanDecision?.decidedAt || addMinutes(reportTime, 10);

  return [
    { label: "Report", time: reportTime, detail: "Received" },
    { label: "Evidence", time: evidenceTime, detail: `Linked ${incident.evidence.length} items` },
    { label: "Analyst", time: analystTime, detail: incident.gonka.analyst.responseId },
    { label: "Reviewer", time: reviewerTime, detail: incident.gonka.reviewer.responseId },
    { label: "Consensus", time: consensusTime, detail: scoreText(incident) },
    { label: "Safety", time: safetyTime, detail: isDispatchBlocked(incident) ? "Gates blocked" : "Gates pass" },
    { label: "Human", time: humanTime, detail: incident.humanDecision?.decidedBy || "Pending" },
    { label: "Action", time: humanTime, detail: incident.humanDecision?.decision === "APPROVED" ? "Approved" : "Locked" }
  ];
}

function selectIncident(caseId) {
  state.selectedCaseId = caseId;
  ensureEvidenceSelection();
}

function ensureEvidenceSelection() {
  const incident = getSelectedIncident();
  if (!incident) {
    state.selectedEvidenceId = null;
    return;
  }
  const hasSelected = incident.evidence.some(item => item.id === state.selectedEvidenceId);
  if (!hasSelected) {
    state.selectedEvidenceId = incident.evidence[0]?.id || null;
  }
}

function getSelectedIncident() {
  return state.incidents.find(item => item.caseId === state.selectedCaseId) || state.incidents[0] || null;
}

function getSelectedEvidence(incident) {
  return incident.evidence.find(item => item.id === state.selectedEvidenceId) || incident.evidence[0] || null;
}

function findCaseByLabel(label) {
  return state.incidents.find(incident => incident.label === label);
}

function getGate(incident, id) {
  return incident.safetyGates.find(gate => gate.id === id);
}

function gatePassed(incident, id) {
  return getGate(incident, id)?.passed === true;
}

function isDispatchBlocked(incident) {
  const dispatchGate = getGate(incident, "G_DISPATCH");
  return dispatchGate?.status === "locked" || incident.safetyGates.some(gate => gate.status === "blocked");
}

function dispatchRelevantGates(incident) {
  return incident.safetyGates.filter(gate => gate.id !== "G_DISPATCH");
}

function blockedGateCount(incident) {
  return dispatchRelevantGates(incident).filter(gate => gate.status === "blocked").length;
}

function supportedClaimCount(incident) {
  return incident.claims.filter(claim => ["supported", "partially_supported", "partially_corroborated", "plausible"].includes(claim.status)).length;
}

function unverifiedClaimCount(incident) {
  return incident.claims.filter(claim => ["reported_unverified", "unverified", "unverifiable"].includes(claim.status)).length;
}

function countByState(operationalState) {
  return state.incidents.filter(incident => incident.operationalState === operationalState).length;
}

function queueSubtitle(incident) {
  if (incident.label === "02") return "Hostel B · 3 forwards → 1 source";
  if (incident.label === "04") return "Campus grounds · Models disagree";
  return incident.location || incident.source;
}

function scoreText(incident) {
  return `V${incident.scores.verification} · U${incident.scores.urgency} · A${incident.scores.actionability}`;
}

function urgencyCaption(incident) {
  if (incident.scores.urgency >= 90) return "Potential respiratory emergency";
  if (incident.scores.urgency >= 70) return "Time-sensitive public safety risk";
  return "Important but lower immediate danger";
}

function actionabilityCaption(incident) {
  if (incident.scores.actionability < 35) return "Critical information missing";
  if (incident.scores.actionability < 70) return "Needs coordinator clarification";
  return "Enough information for bounded action";
}

function insightCopy(incident) {
  if (incident.operationalState === "URGENT_VERIFICATION") {
    return "A report can be poorly evidenced and still represent a life-threatening situation.";
  }
  if (incident.operationalState === "DISPATCH_CANDIDATE") {
    return "AI prepares the decision chain, but the coordinator still approves the dispatch.";
  }
  return incident.insight || "CrisisRoute separates evidence confidence from operational urgency.";
}

function pathDetail(status, detail) {
  if (!detail) return "";
  const label = gateStatusLabels[status] || normalizeLabel(status);
  return `${label} - ${detail}`;
}

function connectionKind(claim, evidence) {
  const status = claim.status || "";
  if (status.includes("contradict")) return "contradiction";
  if ((evidence?.type || "").toLowerCase().includes("no independent")) return "none";
  if (status.includes("partial") || status.includes("plausible") || status.includes("unverifiable")) return "partial";
  return "supports";
}

function claimStatusClass(status) {
  if (String(status).includes("contradict")) return "contradiction";
  if (["plausible", "partially_supported", "partially_corroborated", "unverifiable"].includes(status)) return "partial";
  if (["reported", "reported_unverified", "unverified"].includes(status)) return "reported";
  return "supported";
}

function stateClass(stateName) {
  if (stateName === "DISPATCH_CANDIDATE") return "state-green";
  if (stateName === "URGENT_VERIFICATION") return "state-amber";
  if (stateName === "NEEDS_HUMAN_REVIEW") return "state-violet";
  if (stateName === "MERGE_OR_VERIFY") return "state-blue";
  return "state-muted";
}

function modeLabel(mode) {
  if (mode === DATA_MODES.replay) return "REPLAY";
  if (mode === DATA_MODES.live) return "LIVE";
  return "DEMO SNAPSHOT";
}

function shortModeLabel(mode) {
  if (mode === DATA_MODES.replay) return "Replay";
  if (mode === DATA_MODES.live) return "Live";
  return "Demo";
}

function gonkaLabel() {
  if (state.mode === DATA_MODES.mock) return "DEMO DATA";
  if (state.mode === DATA_MODES.replay) return "RECORDED RESPONSE";
  return isLiveConnected() ? "CONNECTED" : "UNAVAILABLE";
}

function gonkaTone() {
  if (state.mode === DATA_MODES.live && isLiveConnected()) return "connected";
  if (state.mode === DATA_MODES.live) return "unavailable";
  return "";
}

function modeFootnote() {
  if (state.mode === DATA_MODES.mock) {
    return "Demo mode uses local snapshot data. It does not pretend to be live Gonka verification.";
  }
  if (state.mode === DATA_MODES.replay) {
    return "Replay mode uses recorded-style responses for demo rehearsal.";
  }
  return isLiveConnected()
    ? "Live mode uses confirmed backend Gonka routes."
    : "Live backend is unavailable until teammate integration is complete.";
}

function isLiveConnected() {
  return state.mode === DATA_MODES.live && state.health?.ok === true && state.health?.liveRoutesReady === true;
}

function listItems(items) {
  return items.map(item => `<li>${escapeHtml(item)}</li>`).join("");
}

function normalizeLabel(value) {
  return String(value || "")
    .replaceAll("_", " ")
    .replace(/\b\w/g, char => char.toUpperCase());
}

function formatPeople(value) {
  if (value === null || value === undefined) return "people unknown";
  return `${value} ${Number(value) === 1 ? "person" : "people"}`;
}

function formatTime(value) {
  if (!value) return "Pending";
  try {
    return `${new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
      timeZone: "Asia/Kuala_Lumpur"
    }).format(new Date(value))} MYT`;
  } catch {
    return value;
  }
}

function formatDateTime(value) {
  if (!value) return "Pending";
  try {
    const date = new Date(value);
    const datePart = new Intl.DateTimeFormat("en-CA", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      timeZone: "Asia/Kuala_Lumpur"
    }).format(date);
    return `${datePart} ${formatTime(value)}`;
  } catch {
    return value;
  }
}

function addMinutes(value, minutes) {
  const date = new Date(value);
  date.setMinutes(date.getMinutes() + minutes);
  return date.toISOString();
}

function arrayText(value) {
  return Array.isArray(value) ? value.join(" · ") : value;
}

function shortHash(value) {
  return String(value).replace(/^(sha256:[a-z0-9]{4})[a-z0-9]+([a-z0-9]{4})$/i, "$1...$2");
}

function fallbackAnalystReview(incident) {
  return {
    conclusion: incident.modelDebate.consensus,
    evidenceCited: incident.evidence.slice(0, 2).map(item => item.id),
    scores: incident.scores,
    rationale: incident.recommendedAction
  };
}

function fallbackReviewerReview(incident) {
  return {
    conclusion: incident.modelDebate.counterEvidence.join(" · ") || "No counter-evidence recorded",
    counterEvidence: incident.modelDebate.counterEvidence,
    unknowns: incident.missingFields,
    duplicateRisk: "Not specified",
    scores: incident.scores,
    rationale: incident.modelDebate.disagreement.join(" · ") || incident.modelDebate.consensus
  };
}

function showToast(message) {
  state.toast = message;
  render();
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => {
    state.toast = null;
    render();
  }, 2800);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeSvg(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}

function simpleHash(input) {
  let hash = 0x811c9dc5;
  for (let i = 0; i < input.length; i += 1) {
    hash ^= input.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  return (hash >>> 0).toString(16).padStart(8, "0");
}

init();
